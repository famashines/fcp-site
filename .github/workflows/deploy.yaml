name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: famashines/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Deploy the image through a gitops pull request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          tag="sha-${SHA}"
          short="${SHA::7}"
          branch="release/fcp-site-prod-${short}"
          sed -i "s|newTag: .*|newTag: ${tag}|" kubernetes/fcp/fcp-site/prod/kustomization.yaml
          if git diff --quiet; then
            echo "prod already uses ${tag}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(fcp-site): release sha-${short} to prod"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(fcp-site): release sha-${short} to prod" \
            --body "Deploy \`ghcr.io/${GITHUB_REPOSITORY}:${tag}\` to prod, from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}."
          gh pr merge "$branch" --rebase --delete-branch
